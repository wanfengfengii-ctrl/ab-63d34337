# API port is configurable through the host environment, e.g.
#   API_PORT=9000 docker compose up --build
# It is used both for the host port mapping and the in-container bind port.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: horizon-api:latest
    environment:
      API_PORT: ${API_PORT:-8000}
    ports:
      # Bind to loopback by default; override HOST_BIND to expose elsewhere.
      - "${HOST_BIND:-127.0.0.1}:${API_PORT:-8000}:${API_PORT:-8000}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,os,urllib.request; port=os.environ.get('API_PORT','8000'); r=urllib.request.urlopen('http://127.0.0.1:'+port+'/health',timeout=2); assert json.load(r)['status']=='ok'"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # One-shot verification job:
  #   docker compose run --rm verify
  # It starts only after the api service is healthy, then runs the code tests,
  # the image build check and the joint-picking API smoke tests, reporting the
  # overall result through its exit code.
  verify:
    build:
      context: .
      dockerfile: Dockerfile
      target: verify
    image: horizon-verify:latest
    environment:
      API_HOST: api
      API_PORT: ${API_PORT:-8000}
      PROJECT_ROOT: /workspace
    depends_on:
      api:
        condition: service_healthy
    volumes:
      # Docker CLI in the verify container talks to the host daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      # Build context for the image-build check.
      - .:/workspace
    restart: "no"
